<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AR Artwork Experience</title>

    <!-- A-Frame & MindAR -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        user-select: none;
        -webkit-user-select: none;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      /* Hide default A-Frame VR buttons and standard MindAR scanning screens */
      .a-enter-vr { display: none !important; }
      .a-enter-ar { display: none !important; }
      .mindar-ui-overlay { display: none !important; }
      .mindar-ui-loading { display: none !important; }
      .mindar-ui-scanning { display: none !important; }

      /* Visual Loading Overlay */
      #ar-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
        color: #fff;
        padding: 24px;
        text-align: center;
        transition: opacity 0.4s ease-out, visibility 0.4s;
      }

      #ar-loader.loaded {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .spinner-ring {
        width: 64px;
        height: 64px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: #38bdf8;
        border-right-color: #2dd4bf;
        border-radius: 50%;
        animation: spin 1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
        margin-bottom: 20px;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .loader-title {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.5px;
        margin-bottom: 6px;
      }

      .loader-sub {
        font-size: 13px;
        color: #94a3b8;
        margin-bottom: 20px;
        max-width: 300px;
      }

      .loader-badge {
        font-size: 11px;
        font-family: monospace;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 999px;
        padding: 6px 16px;
        color: #38bdf8;
      }

      .error-btn {
        display: none;
        margin-top: 18px;
        padding: 10px 20px;
        background: #38bdf8;
        color: #0f172a;
        font-size: 13px;
        font-weight: 600;
        border-radius: 999px;
        border: none;
        cursor: pointer;
      }

      /* Scanning Reticle */
      #scanning-hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        transition: opacity 0.3s;
      }

      #scanning-hud.hidden {
        opacity: 0;
      }

      .hud-frame {
        position: relative;
        width: 260px;
        height: 260px;
        border: 2px dashed rgba(56, 189, 248, 0.4);
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .hud-text {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.85);
        background: rgba(0, 0, 0, 0.6);
        padding: 6px 14px;
        border-radius: 999px;
        margin-top: 16px;
        backdrop-filter: blur(4px);
      }

      /* Audio Status Badge */
      #audio-badge {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1001;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 8px 14px;
        border-radius: 999px;
        font-size: 12px;
        backdrop-filter: blur(8px);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- Visual Loading Screen -->
    <div id="ar-loader">
      <div class="spinner-ring" id="loader-spinner"></div>
      <div class="loader-title" id="loader-title">Starting AR Artwork Experience</div>
      <div class="loader-sub" id="loader-sub">Initializing camera & loading target tracker...</div>
      <div class="loader-badge" id="loader-status">Requesting camera access...</div>
      <button class="error-btn" id="error-action" onclick="location.reload()">Grant Permission & Retry</button>
    </div>

    <!-- Active Scanning Reticle -->
    <div id="scanning-hud">
      <div class="hud-frame">
        <div style="font-size: 28px;">📷</div>
        <div class="hud-text">Point camera at target artwork</div>
      </div>
    </div>

    <!-- Sound Toggle -->
    <div id="audio-badge">🔊 Tap for Sound</div>

    <!-- A-Frame WebAR Scene with MindAR Tracking -->
    <a-scene
      mindar-image="imageTargetSrc: ./assets/targets.mind; filterMinCF: 0.001; filterBeta: 1000; warmupTolerance: 2; missTolerance: 4;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <video
          id="artwork-video"
          src="./assets/my-video.mp4"
          preload="auto"
          loop
          playsinline
          webkit-playsinline
          x5-playsinline
          muted
          crossorigin="anonymous"
        ></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target Anchor -->
      <a-entity id="target-anchor" mindar-image-target="targetIndex: 0">
        <a-video
          id="ar-video-plane"
          src="#artwork-video"
          position="0 0 0"
          height="1"
          width="1.333"
          rotation="0 0 0"
        ></a-video>
      </a-entity>
    </a-scene>

    <script>
      const video = document.getElementById('artwork-video');
      const targetAnchor = document.getElementById('target-anchor');
      const loader = document.getElementById('ar-loader');
      const loaderStatus = document.getElementById('loader-status');
      const loaderTitle = document.getElementById('loader-title');
      const loaderSub = document.getElementById('loader-sub');
      const loaderSpinner = document.getElementById('loader-spinner');
      const errorAction = document.getElementById('error-action');
      const hud = document.getElementById('scanning-hud');
      const audioBadge = document.getElementById('audio-badge');
      const scene = document.querySelector('a-scene');

      let isReady = false;

      // Handle AR readiness
      scene.addEventListener('arReady', () => {
        isReady = true;
        if (loaderStatus) loaderStatus.innerText = '✓ Camera & Tracker ready!';
        setTimeout(() => {
          if (loader) loader.classList.add('loaded');
        }, 300);
      });

      // Handle Camera / Target errors gracefully
      scene.addEventListener('arError', (event) => {
        isReady = false;
        if (loaderSpinner) loaderSpinner.style.display = 'none';
        if (loaderTitle) loaderTitle.innerText = 'Camera Access Required';
        if (loaderSub) loaderSub.innerText = 'Please ensure camera permissions are allowed in your browser settings (requires HTTPS).';
        if (loaderStatus) {
          loaderStatus.innerText = 'Camera permission blocked or unavailable';
          loaderStatus.style.color = '#f87171';
        }
        if (errorAction) errorAction.style.display = 'block';
      });

      // 1. Play video ONLY when camera sees the artwork
      targetAnchor.addEventListener('targetFound', () => {
        if (hud) hud.classList.add('hidden');
        video.play().catch(() => {});
      });

      // 2. Pause immediately when camera looks away
      targetAnchor.addEventListener('targetLost', () => {
        if (hud) hud.classList.remove('hidden');
        video.pause();
      });

      // 3. Audio toggle
      function toggleAudio() {
        video.muted = !video.muted;
        if (video.muted) {
          audioBadge.innerText = '🔈 Sound Muted';
        } else {
          audioBadge.innerText = '🔊 Sound On';
        }
      }

      audioBadge.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleAudio();
      });

      window.addEventListener('click', () => {
        if (video.muted) {
          toggleAudio();
        }
      });
    </script>
  </body>
</html>
