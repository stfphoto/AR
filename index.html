<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AR Artwork Experience</title>

    <style>
      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      /* Camera fills background - zero clutter */
      #camera-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        pointer-events: none;
        z-index: 1;
      }

      /* AR Container */
      #ar-stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: auto;
        z-index: 5;
        overflow: hidden;
        cursor: pointer;
      }

      /* Video overlay: STRICTLY the exact size of the physical artwork */
      #video-anchor {
        position: absolute;
        display: none;
        opacity: 0;
        transform-origin: center center;
        border-radius: 8px;
        overflow: hidden;
        border: 2px solid rgba(255, 255, 255, 0.9);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        transition: opacity 0.2s ease-out;
        background: #000;
      }

      #video-anchor.active {
        display: block;
        opacity: 1;
      }

      #overlay-video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!-- Live Camera Feed (Full Screen, No UI Overlays) -->
    <video id="camera-video" playsinline webkit-playsinline x5-playsinline muted autoplay></video>

    <!-- AR Layer: Video anchored strictly on top of the physical artwork -->
    <div id="ar-stage">
      <div id="video-anchor">
        <video
          id="overlay-video"
          playsinline
          webkit-playsinline
          x5-playsinline
          x5-video-player-type="h5-page"
          x5-video-player-fullscreen="false"
          loop
          muted
          crossorigin="anonymous"
          preload="auto"
        ></video>
      </div>
    </div>

    <script>
      // =========================================================================
      // 1. AR CONFIGURATION
      // Change the paths below to your photo and video in your assets folder!
      // =========================================================================
      const AR_CONFIG = {
        // Physical picture/artwork to recognize (can be "assets/artwork.jpg" or a URL)
        targetArtworkImage: "https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?auto=format&fit=crop&w=1200&q=80",

        // Video to play on top of physical picture (can be "assets/video.mp4" or a URL)
        overlayVideo: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",

        // Aspect ratio of the physical picture (width / height, default 1.333 for 4:3)
        aspectRatio: 1.333
      };

      const cameraVideo = document.getElementById('camera-video');
      const overlayVideo = document.getElementById('overlay-video');
      const videoAnchor = document.getElementById('video-anchor');
      const arStage = document.getElementById('ar-stage');

      overlayVideo.src = AR_CONFIG.overlayVideo;

      // Prevent mobile browsers from launching native fullscreen player
      overlayVideo.setAttribute('playsinline', '');
      overlayVideo.setAttribute('webkit-playsinline', '');
      overlayVideo.muted = true;

      // =========================================================================
      // 2. Camera Access
      // =========================================================================
      async function initCamera() {
        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
          const stream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: { ideal: 'environment' },
              width: { ideal: 1280 },
              height: { ideal: 720 }
            },
            audio: false
          });
          cameraVideo.srcObject = stream;
          cameraVideo.play().catch(() => {});
        } catch (err) {
          console.warn("Camera access denied or unavailable");
        }
      }
      initCamera();

      // =========================================================================
      // 3. Multi-Feature Target Analyzer (Edge + Luminance Structure)
      // =========================================================================
      let targetDesc = null;
      const offCanvas = document.createElement('canvas');
      offCanvas.width = 320;
      offCanvas.height = 240;
      const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });

      function loadTargetDescriptor(url) {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          try {
            const size = 32;
            const c = document.createElement('canvas');
            c.width = size; c.height = size;
            const ctx = c.getContext('2d');
            ctx.drawImage(img, 0, 0, size, size);
            const data = ctx.getImageData(0, 0, size, size).data;

            // 1. Zero-mean unit-variance luminance vector
            const luma = new Float32Array(size * size);
            let sum = 0;
            for (let i = 0; i < size * size; i++) {
              const val = 0.299 * data[i * 4] + 0.587 * data[i * 4 + 1] + 0.114 * data[i * 4 + 2];
              luma[i] = val;
              sum += val;
            }
            const mean = sum / (size * size);
            let varSum = 0;
            for (let i = 0; i < size * size; i++) {
              luma[i] -= mean;
              varSum += luma[i] * luma[i];
            }
            const std = Math.sqrt(varSum / (size * size)) || 1;
            for (let i = 0; i < size * size; i++) luma[i] /= std;

            // 2. Edge gradient profile (horizontal & vertical Sobel deltas)
            const edges = new Float32Array(size * size);
            let edgeSum = 0;
            for (let y = 1; y < size - 1; y++) {
              for (let x = 1; x < size - 1; x++) {
                const idx = y * size + x;
                const dx = luma[idx + 1] - luma[idx - 1];
                const dy = luma[idx + size] - luma[idx - size];
                const mag = Math.sqrt(dx * dx + dy * dy);
                edges[idx] = mag;
                edgeSum += mag;
              }
            }
            const edgeMean = edgeSum / (size * size);
            for (let i = 0; i < size * size; i++) edges[i] -= edgeMean;
            let edgeVarSum = 0;
            for (let i = 0; i < size * size; i++) edgeVarSum += edges[i] * edges[i];
            const edgeStd = Math.sqrt(edgeVarSum / (size * size)) || 1;
            for (let i = 0; i < size * size; i++) edges[i] /= edgeStd;

            targetDesc = { luma, edges };
          } catch {
            targetDesc = null;
          }
        };
        img.onerror = () => {
          targetDesc = null;
        };
        img.src = url;
      }
      loadTargetDescriptor(AR_CONFIG.targetArtworkImage);

      // =========================================================================
      // 4. Real-World Robust Scanning & Tracking Engine
      // =========================================================================
      let isTracking = false;
      let consecutiveFound = 0;
      let lostFrames = 999;
      let smoothed = { x: 0.5, y: 0.5, w: 0.5, h: 0.5 / AR_CONFIG.aspectRatio };

      function processCameraFrame() {
        if (!targetDesc || cameraVideo.readyState < 2) {
          isTracking = false;
          return;
        }

        const sw = offCanvas.width;
        const sh = offCanvas.height;
        offCtx.drawImage(cameraVideo, 0, 0, sw, sh);
        const frameData = offCtx.getImageData(0, 0, sw, sh).data;

        const candidates = [];

        // If currently tracking: search locally around previous position first
        if (isTracking && lostFrames < 15) {
          const offsets = [-0.04, 0, 0.04];
          const scaleOffsets = [0.93, 1.0, 1.07];
          for (const s of scaleOffsets) {
            for (const dx of offsets) {
              for (const dy of offsets) {
                candidates.push({
                  cx: Math.max(0.2, Math.min(0.8, smoothed.x + dx)),
                  cy: Math.max(0.2, Math.min(0.8, smoothed.y + dy)),
                  w: Math.max(0.25, Math.min(0.85, smoothed.w * s)),
                  h: (smoothed.w * s) / AR_CONFIG.aspectRatio
                });
              }
            }
          }
        } else {
          // Global multi-scale search grid across the viewfinder
          const scales = [0.38, 0.52, 0.68];
          const gridX = [0.35, 0.5, 0.65];
          const gridY = [0.4, 0.5, 0.6];

          // Center priority
          for (const sc of scales) {
            candidates.push({ cx: 0.5, cy: 0.5, w: sc, h: sc / AR_CONFIG.aspectRatio });
          }
          // Grid positions
          for (const sc of [0.45, 0.6]) {
            for (const gx of gridX) {
              for (const gy of gridY) {
                if (gx === 0.5 && gy === 0.5) continue;
                candidates.push({ cx: gx, cy: gy, w: sc, h: sc / AR_CONFIG.aspectRatio });
              }
            }
          }
        }

        let bestScore = 0;
        let bestCand = null;

        for (const cand of candidates) {
          const score = evaluateCandidate(frameData, sw, sh, cand.cx, cand.cy, cand.w, cand.h);
          if (score > bestScore) {
            bestScore = score;
            bestCand = cand;
          }
        }

        // Calibrated realistic thresholds:
        // Initial detection: 0.48 (matches real photos under room lighting)
        // Continuous tracking: 0.38 (maintains lock while camera moves)
        const threshold = isTracking ? 0.38 : 0.48;

        if (bestScore >= threshold && bestCand) {
          consecutiveFound++;
          lostFrames = 0;

          if (consecutiveFound >= 2 || isTracking) {
            isTracking = true;

            const alpha = 0.30;
            smoothed.x = smoothed.x * (1 - alpha) + bestCand.cx * alpha;
            smoothed.y = smoothed.y * (1 - alpha) + bestCand.cy * alpha;
            smoothed.w = smoothed.w * (1 - alpha) + bestCand.w * alpha;
            smoothed.h = smoothed.w / AR_CONFIG.aspectRatio;
          }
        } else {
          consecutiveFound = 0;
          lostFrames++;
          if (lostFrames > 18) {
            isTracking = false;
          }
        }
      }

      function evaluateCandidate(frameData, sw, sh, cx, cy, w, h) {
        if (!targetDesc) return 0;
        const startX = Math.max(0, Math.floor((cx - w / 2) * sw));
        const startY = Math.max(0, Math.floor((cy - h / 2) * sh));
        const regW = Math.min(sw - startX, Math.floor(w * sw));
        const regH = Math.min(sh - startY, Math.floor(h * sh));
        if (regW < 20 || regH < 20) return 0;

        const size = 32;
        const stepX = regW / size;
        const stepY = regH / size;
        let sum = 0;
        const sampleLuma = new Float32Array(size * size);

        for (let sy = 0; sy < size; sy++) {
          for (let sx = 0; sx < size; sx++) {
            const px = Math.floor(startX + sx * stepX);
            const py = Math.floor(startY + sy * stepY);
            const idx = (py * sw + px) * 4;
            const l = 0.299 * frameData[idx] + 0.587 * frameData[idx + 1] + 0.114 * frameData[idx + 2];
            sampleLuma[sy * size + sx] = l;
            sum += l;
          }
        }

        const mean = sum / (size * size);
        let varSum = 0;
        for (let i = 0; i < size * size; i++) {
          sampleLuma[i] -= mean;
          varSum += sampleLuma[i] * sampleLuma[i];
        }
        const std = Math.sqrt(varSum / (size * size));

        // Rejection filter: Blank walls, tables, and floors have std < 5.5 -> reject immediately
        if (std < 5.5) return 0;

        for (let i = 0; i < size * size; i++) sampleLuma[i] /= std;

        // 1. Luminance ZNCC correlation
        let lumaDot = 0;
        for (let i = 0; i < size * size; i++) {
          lumaDot += sampleLuma[i] * targetDesc.luma[i];
        }
        const lumaScore = (lumaDot / (size * size) + 1) / 2;

        // 2. Edge gradient correlation
        let edgeDot = 0;
        for (let y = 1; y < size - 1; y++) {
          for (let x = 1; x < size - 1; x++) {
            const idx = y * size + x;
            const dx = sampleLuma[idx + 1] - sampleLuma[idx - 1];
            const dy = sampleLuma[idx + size] - sampleLuma[idx - size];
            const mag = Math.sqrt(dx * dx + dy * dy);
            edgeDot += mag * targetDesc.edges[idx];
          }
        }
        const edgeScore = (edgeDot / (size * size) + 1) / 2;

        return lumaScore * 0.6 + edgeScore * 0.4;
      }

      // =========================================================================
      // 5. Render Loop: Position Video Directly on Detected Physical Artwork
      // =========================================================================
      function renderLoop() {
        requestAnimationFrame(renderLoop);
        processCameraFrame();

        if (isTracking) {
          if (overlayVideo.paused) {
            overlayVideo.play().catch(() => {});
          }

          const screenW = window.innerWidth;
          const screenH = window.innerHeight;

          // Video size matches the detected artwork's dimensions on screen
          const pixelW = Math.round(screenW * smoothed.w);
          const pixelH = Math.round(pixelW / AR_CONFIG.aspectRatio);

          const pixelX = Math.round(screenW * smoothed.x - pixelW / 2);
          const pixelY = Math.round(screenH * smoothed.y - pixelH / 2);

          videoAnchor.style.width = pixelW + 'px';
          videoAnchor.style.height = pixelH + 'px';
          videoAnchor.style.transform = `translate3d(${pixelX}px, ${pixelY}px, 0px)`;

          if (!videoAnchor.classList.contains('active')) {
            videoAnchor.classList.add('active');
          }
        } else {
          // Hide video completely when artwork is NOT in view
          if (videoAnchor.classList.contains('active')) {
            videoAnchor.classList.remove('active');
          }
          if (!overlayVideo.paused) {
            overlayVideo.pause();
          }
        }
      }
      renderLoop();

      // =========================================================================
      // 6. User Tap: Toggle Audio Mute / Unmute
      // =========================================================================
      arStage.addEventListener('click', () => {
        overlayVideo.muted = !overlayVideo.muted;
      });
    </script>
  </body>
</html>
