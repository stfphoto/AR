<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AR Artwork Experience</title>

    <!-- A-Frame & MindAR (Industry Standard WebAssembly Image Tracking) -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        user-select: none;
        -webkit-user-select: none;
      }

      /* Hide all default VR buttons and scanning overlays for a pure clean camera */
      .a-enter-vr { display: none !important; }
      .a-enter-ar { display: none !important; }
      .mindar-ui-overlay { display: none !important; }
      .mindar-ui-loading { display: none !important; }
      .mindar-ui-scanning { display: none !important; }
    </style>
  </head>
  <body>
    <!-- A-Frame WebAR Scene -->
    <a-scene
      mindar-image="imageTargetSrc: assets/targets.mind; filterMinCF: 0.001; filterBeta: 1000; warmupTolerance: 2; missTolerance: 4;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <!-- Your overlay video -->
        <video
          id="artwork-video"
          src="assets/my-video.mp4"
          preload="auto"
          loop
          playsinline
          webkit-playsinline
          x5-playsinline
          muted
          crossorigin="anonymous"
        ></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target Anchor: Glued 100% to your physical artwork -->
      <a-entity id="target-anchor" mindar-image-target="targetIndex: 0">
        <!-- Video plane: Width: 1.333, Height: 1 (Standard 4:3 aspect ratio).
             If your artwork is 16:9, set width="1.777". If 1:1 square, set width="1". -->
        <a-video
          id="ar-video-plane"
          src="#artwork-video"
          position="0 0 0"
          height="1"
          width="1.333"
          rotation="0 0 0"
        ></a-video>
      </a-entity>
    </a-scene>

    <script>
      const video = document.getElementById('artwork-video');
      const targetAnchor = document.getElementById('target-anchor');

      // 1. Play video ONLY when camera genuinely locks onto the physical artwork
      targetAnchor.addEventListener('targetFound', () => {
        video.play().catch(() => {});
      });

      // 2. Pause video immediately when camera looks away
      targetAnchor.addEventListener('targetLost', () => {
        video.pause();
      });

      // 3. Tap anywhere on screen to toggle audio (mute / unmute)
      window.addEventListener('click', () => {
        video.muted = !video.muted;
      });
    </script>
  </body>
</html>
