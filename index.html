<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>AR Artwork Experience</title>
<!-- Three.js 3D Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
* {
box-sizing: border-box;
}
html, body {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
overflow: hidden;
background: #000;
user-select: none;
-webkit-user-select: none;
-webkit-touch-callout: none;
}
#camera-video {
position: absolute;
inset: 0;
width: 100%;
height: 100%;
object-fit: cover;
pointer-events: none;
}
#ar-container {
position: absolute;
inset: 0;
width: 100%;
height: 100%;
cursor: pointer;
}
#simulated-card {
display: none;
position: absolute;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
width: 320px;
max-width: 80vw;
aspect-ratio: 4/3;
border-radius: 12px;
overflow: hidden;
box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
border: 2px solid rgba(255, 255, 255, 0.85);
pointer-events: none;
z-index: 10;
}
#simulated-card img {
width: 100%;
height: 100%;
object-fit: cover;
}
</style>
</head>
<body>
<!-- Live Camera Feed (Fills Screen, Nothing On Top) -->
<video id="camera-video" playsinline webkit-playsinline muted autoplay></video>

<!-- Simulated artwork on desktop when double-tapping to test -->
<div id="simulated-card">
<img id="simulated-img" src="" alt="Artwork Target" />
</div>

<!-- Hidden Video Source for AR 3D Texture -->
<video id="overlay-video" playsinline webkit-playsinline loop muted crossorigin="anonymous" preload="auto" style="display:none;"></video>

<!-- AR WebGL 3D Canvas Container -->
<div id="ar-container"></div>

<script>
// =========================================================================
// 1. AR CONFIGURATION
// Change the paths below to your photo and video in your assets folder!
// =========================================================================
const AR_CONFIG = {
// Physical picture/artwork to recognize (can be "assets/artwork.jpg" or a URL)
targetArtworkImage: "https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?auto=format&fit=crop&w=1200&q=80",

// Video to play on top of the physical picture (can be "assets/video.mp4" or a URL)
overlayVideo: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",

// Aspect ratio (width / height, default 1.333 for 4:3)
aspectRatio: 1.333
};

// Set up elements
const cameraVideo = document.getElementById('camera-video');
const overlayVideo = document.getElementById('overlay-video');
const arContainer = document.getElementById('ar-container');
const simulatedCard = document.getElementById('simulated-card');
const simulatedImg = document.getElementById('simulated-img');

overlayVideo.src = AR_CONFIG.overlayVideo;
simulatedImg.src = AR_CONFIG.targetArtworkImage;

let isSimulated = false;
let lastTapTime = 0;

// =========================================================================
// 2. Camera Access
// =========================================================================
async function initCamera() {
try {
if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
const stream = await navigator.mediaDevices.getUserMedia({
video: {
facingMode: { ideal: 'environment' },
width: { ideal: 1920 },
height: { ideal: 1080 }
},
audio: false
});
cameraVideo.srcObject = stream;
cameraVideo.play().catch(() => {});
} catch (err) {
console.warn("Camera not available, double-tap screen to simulate artwork");
}
}
initCamera();

// =========================================================================
// 3. Three.js 3D Video Setup
// =========================================================================
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 4.2);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
arContainer.appendChild(renderer.domElement);

// Create Video Texture
const videoTexture = new THREE.VideoTexture(overlayVideo);
videoTexture.colorSpace = THREE.SRGBColorSpace;
videoTexture.minFilter = THREE.LinearFilter;
videoTexture.magFilter = THREE.LinearFilter;

// Plane matching physical picture dimensions
const planeW = 1.5;
const planeH = planeW / AR_CONFIG.aspectRatio;
const geo = new THREE.PlaneGeometry(planeW, planeH);
const mat = new THREE.MeshBasicMaterial({ map: videoTexture, side: THREE.DoubleSide });
const videoMesh = new THREE.Mesh(geo, mat);
videoMesh.scale.set(0.0001, 0.0001, 0.0001);
scene.add(videoMesh);

// White outline border
const borderGeo = new THREE.PlaneGeometry(planeW + 0.05, planeH + 0.05);
const borderMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
const borderMesh = new THREE.Mesh(borderGeo, borderMat);
borderMesh.position.z = -0.005;
borderMesh.scale.set(0.0001, 0.0001, 0.0001);
scene.add(borderMesh);

window.addEventListener('resize', () => {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
});

// =========================================================================
// 4. Computer Vision Image Tracker
// =========================================================================
let targetDescriptor = null;
const offscreenCanvas = document.createElement('canvas');
offscreenCanvas.width = 320;
offscreenCanvas.height = 240;
const offscreenCtx = offscreenCanvas.getContext('2d', { willReadFrequently: true });

function loadTargetImage(url) {
const img = new Image();
img.crossOrigin = 'anonymous';
img.onload = () => {
try {
const size = 32;
const c = document.createElement('canvas');
c.width = size; c.height = size;
const ctx = c.getContext('2d');
ctx.drawImage(img, 0, 0, size, size);
const data = ctx.getImageData(0, 0, size, size).data;

const luma = new Float32Array(size * size);
let sum = 0;
for (let i = 0; i < size * size; i++) {
const val = 0.299 * data[i * 4] + 0.587 * data[i * 4 + 1] + 0.114 * data[i * 4 + 2];
luma[i] = val;
sum += val;
}
const mean = sum / (size * size);
let varSum = 0;
for (let i = 0; i < size * size; i++) {
luma[i] -= mean;
varSum += luma[i] * luma[i];
}
const std = Math.sqrt(varSum / (size * size)) || 1;
for (let i = 0; i < size * size; i++) luma[i] /= std;

targetDescriptor = { luma };
} catch {
targetDescriptor = { luma: new Float32Array(1024).fill(0.1) };
}
};
img.onerror = () => {
targetDescriptor = { luma: new Float32Array(1024).fill(0.1) };
};
img.src = url;
}
loadTargetImage(AR_CONFIG.targetArtworkImage);

let trackedPose = null;
let currentScale = 0.0001;

function scanVideoFrame() {
if (isSimulated) {
trackedPose = { x: 0.5, y: 0.5, width: 0.44, pitch: 0, yaw: 0, angle: 0, confidence: 1 };
return;
}

if (!targetDescriptor || cameraVideo.readyState < 2) {
trackedPose = null;
return;
}

const sw = offscreenCanvas.width;
const sh = offscreenCanvas.height;
offscreenCtx.drawImage(cameraVideo, 0, 0, sw, sh);
const frameData = offscreenCtx.getImageData(0, 0, sw, sh).data;

// Candidate scan window
const cx = 0.5, cy = 0.5, w = 0.46, h = 0.46 / AR_CONFIG.aspectRatio;
const startX = Math.floor((cx - w/2) * sw);
const startY = Math.floor((cy - h/2) * sh);
const regW = Math.floor(w * sw);
const regH = Math.floor(h * sh);

const size = 32;
const stepX = regW / size;
const stepY = regH / size;
let sum = 0;
const sampleLuma = new Float32Array(size * size);

for (let sy = 0; sy < size; sy++) {
for (let sx = 0; sx < size; sx++) {
const px = Math.floor(startX + sx * stepX);
const py = Math.floor(startY + sy * stepY);
const idx = (py * sw + px) * 4;
const l = 0.299 * frameData[idx] + 0.587 * frameData[idx+1] + 0.114 * frameData[idx+2];
sampleLuma[sy * size + sx] = l;
sum += l;
}
}
const mean = sum / (size * size);
let varSum = 0;
for (let i = 0; i < size * size; i++) {
sampleLuma[i] -= mean;
varSum += sampleLuma[i] * sampleLuma[i];
}
const std = Math.sqrt(varSum / (size * size));

if (std < 4) {
trackedPose = null;
return;
}

let dot = 0;
for (let i = 0; i < size * size; i++) {
dot += (sampleLuma[i] / std) * targetDescriptor.luma[i];
}
const score = (dot / (size * size) + 1) / 2;

if (score > 0.55) {
trackedPose = { x: cx, y: cy, width: w, pitch: 0, yaw: 0, angle: 0, confidence: score };
} else {
trackedPose = null;
}
}

// =========================================================================
// 5. Main Render Loop
// =========================================================================
function animate() {
requestAnimationFrame(animate);
scanVideoFrame();

const isVisible = trackedPose !== null && trackedPose.confidence > 0.45;

// Play/Pause Video
if (isVisible) {
if (overlayVideo.paused) overlayVideo.play().catch(() => {});
} else {
if (!overlayVideo.paused) overlayVideo.pause();
}

// 3D Transform Alignment
if (isVisible && trackedPose) {
const screenX = (trackedPose.x - 0.5) * 2;
const screenY = -(trackedPose.y - 0.5) * 2;
scene.position.x += (screenX * 1.8 - scene.position.x) * 0.25;
scene.position.y += (screenY * 1.4 - scene.position.y) * 0.25;
}

const targetScale = isVisible ? 1.0 : 0.0001;
currentScale += (targetScale - currentScale) * (isVisible ? 0.15 : 0.3);

videoMesh.scale.set(currentScale, currentScale, currentScale);
borderMesh.scale.set(currentScale, currentScale, currentScale);

renderer.render(scene, camera);
}
animate();

// =========================================================================
// 6. User Tap Interactions
// =========================================================================
arContainer.addEventListener('click', () => {
const now = Date.now();
const diff = now - lastTapTime;
lastTapTime = now;

if (diff < 300) {
// Double-tap: Toggle test simulation mode
isSimulated = !isSimulated;
simulatedCard.style.display = isSimulated ? 'block' : 'none';
} else {
// Single-tap: Toggle audio
overlayVideo.muted = !overlayVideo.muted;
}
});
</script>
</body>
</html>
