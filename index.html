<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AR Artwork Experience</title>

    <!-- A-Frame & MindAR (Industry Standard WebAssembly Image Tracking) -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        user-select: none;
        -webkit-user-select: none;
      }

      /* Hide all default A-Frame VR buttons and MindAR scanning screens for a clean camera view */
      .a-enter-vr { display: none !important; }
      .a-enter-ar { display: none !important; }
      .mindar-ui-overlay { display: none !important; }
      .mindar-ui-loading { display: none !important; }
      .mindar-ui-scanning { display: none !important; }

      /* Visual Loading Overlay */
      #ar-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        transition: opacity 0.4s ease-out, visibility 0.4s;
      }

      #ar-loader.loaded {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .spinner-ring {
        width: 64px;
        height: 64px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: #38bdf8;
        border-right-color: #2dd4bf;
        border-radius: 50%;
        animation: spin 1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
        margin-bottom: 20px;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .loader-title {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.5px;
        margin-bottom: 6px;
      }

      .loader-sub {
        font-size: 13px;
        color: #94a3b8;
        margin-bottom: 20px;
      }

      .loader-badge {
        font-size: 11px;
        font-family: monospace;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 999px;
        padding: 5px 14px;
        color: #38bdf8;
      }
    </style>
  </head>
  <body>
    <!-- Visual Loading Screen -->
    <div id="ar-loader">
      <div class="spinner-ring"></div>
      <div class="loader-title">Starting AR Artwork Experience</div>
      <div class="loader-sub">Initializing camera & loading target tracker...</div>
      <div class="loader-badge" id="loader-status">Preparing AR scene...</div>
    </div>
    <!-- A-Frame WebAR Scene with Rock-Solid MindAR Tracking -->
    <a-scene
      mindar-image="imageTargetSrc: assets/targets.mind; filterMinCF: 0.001; filterBeta: 1000; warmupTolerance: 2; missTolerance: 4;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <!-- The video that will play on top of your physical artwork -->
        <video
          id="artwork-video"
          src="assets/my-video.mp4"
          preload="auto"
          loop
          playsinline
          webkit-playsinline
          x5-playsinline
          muted
          crossorigin="anonymous"
        ></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target Anchor: Glued 100% to your physical artwork -->
      <a-entity id="target-anchor" mindar-image-target="targetIndex: 0">
        <!-- Video plane: Width: 1.333, Height: 1 (Standard 4:3 aspect ratio).
             If your artwork is 16:9, change width to 1.777. If 1:1 square, change width to 1. -->
        <a-video
          id="ar-video-plane"
          src="#artwork-video"
          position="0 0 0"
          height="1"
          width="1.333"
          rotation="0 0 0"
        ></a-video>
      </a-entity>
    </a-scene>

    <script>
      const video = document.getElementById('artwork-video');
      const targetAnchor = document.getElementById('target-anchor');
      const loader = document.getElementById('ar-loader');
      const loaderStatus = document.getElementById('loader-status');
      const scene = document.querySelector('a-scene');

      // Update loading status and dismiss when tracker & camera are ready
      scene.addEventListener('arReady', () => {
        if (loaderStatus) loaderStatus.innerText = 'Camera & Tracker ready!';
        setTimeout(() => {
          if (loader) loader.classList.add('loaded');
        }, 300);
      });

      scene.addEventListener('arError', () => {
        if (loaderStatus) {
          loaderStatus.innerText = 'Camera permission required';
          loaderStatus.style.color = '#f87171';
        }
      });

      // Fallback timer: ensure overlay fades if scene rendered
      setTimeout(() => {
        if (loader && !loader.classList.contains('loaded')) {
          loader.classList.add('loaded');
        }
      }, 5000);

      // 1. Play video ONLY when the camera actually sees the physical artwork
      targetAnchor.addEventListener('targetFound', () => {
        video.play().catch(() => {});
      });

      // 2. Pause video immediately when camera looks away
      targetAnchor.addEventListener('targetLost', () => {
        video.pause();
      });

      // 3. Tap anywhere on screen to toggle audio (mute / unmute)
      window.addEventListener('click', () => {
        video.muted = !video.muted;
      });
    </script>
  </body>
</html>
